// DMagic Orbital Science - science instruments with built-in relay antennas
// Soil moisture parts are L-band science arrays dual-purposed as modest relays,
// not full-size DSN dishes - keep gains below dedicated stock RA antennas.

// Soil Moisture Sensor (100 Gm stock) - ~HG-5 / RelayAntenna5 class
@PART[dmSoilMoisture]:HAS[!MODULE[ModuleRealAntenna]]:NEEDS[DMagicOrbitalScience]:FOR[RealAntennas]
{
    !MODULE[ModuleDataTransmitter],* {}
    %MODULE[ModuleRealAntenna] { %antennaDiameter = 1.0 }
}

// Universal Storage 2 - Soil Moisture Sensor (50 Gm stock)
@PART[dmUS2SoilMoisture]:HAS[!MODULE[ModuleRealAntenna]]:NEEDS[DMagicOrbitalScience]:FOR[RealAntennas]
{
    !MODULE[ModuleDataTransmitter],* {}
    %MODULE[ModuleRealAntenna] { %antennaDiameter = 0.5 }
}

// Undersize Signals Intelligence Satellite (1 Tm stock)
@PART[dmSIGINT.Small]:HAS[!MODULE[ModuleRealAntenna]]:NEEDS[DMagicOrbitalScience]:FOR[RealAntennas]
{
    !MODULE[ModuleDataTransmitter],* {}
    %MODULE[ModuleRealAntenna] { %antennaDiameter = 12.0 }
}

// Oversize Signals Intelligence Satellite (10 Tm stock)
@PART[dmSIGINT|dmSIGINT.End]:HAS[!MODULE[ModuleRealAntenna]]:NEEDS[DMagicOrbitalScience]:FOR[RealAntennas]
{
    !MODULE[ModuleDataTransmitter],* {}
    %MODULE[ModuleRealAntenna] { %antennaDiameter = 40.0 }
}
